      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|alpha' | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src
        run: xcodegen generate

      - name: Build unsigned Release
        working-directory: src
        run: |
          xcodebuild -project FlacLess.xcodeproj -scheme FlacLess \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80

      - name: Package IPA
        working-directory: src
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf Payload FlacLess-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FlacLess-unsigned.ipa Payload
          ls -lh FlacLess-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FlacLess-unsigned-ipa
          path: src/FlacLess-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flacless-${{ github.run_number }}
          name: FlacLess build ${{ github.run_number }}
          body: "Unsigned IPA. Sign and install with ESign / Feather / Scarlet / Sideloadly. Telegram: @rvkqq"
          files: src/FlacLess-unsigned.ipa
