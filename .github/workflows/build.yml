name: Build iOS Redirector Dylib (PRO Clean Mod)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Tweak.m and Compile Redirector.dylib
        run: |
          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <SafariServices/SafariServices.h>
          #import <objc/runtime.h>
          #import <math.h>

          static NSString * const kTargetTelegramURL = @"https://t.me/rvkqq";
          static NSString * const kAllowedIdentifier = @"t.me/rvkqq";
          static NSString * const kCustomBrandTag    = @"@rvkqq";
          static const BOOL kShowCustomWelcomeBanner = NO;
          static NSString * const kRecursionGuardKey = @"com.rvkqq.redirector.recursion_guard";
          static CFAbsoluteTime gLaunchTimestamp = 0;

          static BOOL ShouldRedirectURLString(NSString *urlString) {
              if (!urlString || ![urlString isKindOfClass:[NSString class]] || urlString.length == 0) {
                  return NO;
              }
              NSString *lower = [urlString lowercaseString];
              if ([lower containsString:kAllowedIdentifier]) {
                  return NO;
              }
              static NSArray<NSString *> *blockedKeywords = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  blockedKeywords = @[
                      @"t.me/",
                      @"telegram.me",
                      @"discord.gg",
                      @"discord.com",
                      @"khoindvn",
                      @"khoindns",
                      @"yyyue.xyz",
                      @"esign"
                  ];
              });
              for (NSString *keyword in blockedKeywords) {
                  if ([lower containsString:keyword]) {
                      return YES;
                  }
              }
              return NO;
          }

          static NSURL *RedirectedURLIfNeeded(NSURL *originalURL) {
              if (!originalURL || ![originalURL isKindOfClass:[NSURL class]]) {
                  return originalURL;
              }
              NSString *urlString = [originalURL absoluteString];
              if (ShouldRedirectURLString(urlString)) {
                  return [NSURL URLWithString:kTargetTelegramURL];
              }
              return originalURL;
          }

          static NSString *SanitizeBrandingText(NSString *originalText) {
              if (!originalText || ![originalText isKindOfClass:[NSString class]] || originalText.length == 0) {
                  return originalText;
              }
              NSString *lower = [originalText lowercaseString];
              if ([lower containsString:@"khoindvn"] || [lower containsString:@"khoindns"] || [lower containsString:@"yyyue.xyz"]) {
                  NSString *result = originalText;
                  NSArray<NSString *> *targets = @[@"khoindvn.io.vn", @"khoindvn", @"khoindns.io.vn", @"khoindns", @"yyyue.xyz"];
                  for (NSString *target in targets) {
                      result = [result stringByReplacingOccurrencesOfString:target
                                                                 withString:kCustomBrandTag
                                                                    options:NSCaseInsensitiveSearch
                                                                      range:NSMakeRange(0, result.length)];
                  }
                  return result;
              }
              return originalText;
          }

          static BOOL IsSystemProtectedView(UIView *view) {
              if (!view) return YES;
              if (view.tag == 994411) return YES; // Наше собственное окно, если включено
              NSString *clsName = NSStringFromClass([view class]);
              if ([clsName hasPrefix:@"UILayoutContainer"] ||
                  [clsName hasPrefix:@"UITransition"] ||
                  [clsName hasPrefix:@"UINavigationTransition"] ||
                  [clsName hasPrefix:@"UIViewControllerWrapper"] ||
                  [clsName hasPrefix:@"UITabBar"] ||
                  [clsName hasPrefix:@"UINavigationBar"] ||
                  [clsName hasPrefix:@"_UI"] ||
                  [view isKindOfClass:[UIWindow class]] ||
                  [view isKindOfClass:[UITableView class]] ||
                  [view isKindOfClass:[UICollectionView class]] ||
                  [view isKindOfClass:[UIScrollView class]] ||
                  [view isKindOfClass:[UIControl class]]) {
                  return YES;
              }
              return NO;
          }

          static BOOL IsSplashPopupView(UIView *view) {
              if (!view || IsSystemProtectedView(view)) return NO;
              CFAbsoluteTime elapsed = CFAbsoluteTimeGetCurrent() - gLaunchTimestamp;
              if (elapsed > 25.0) return NO;

              NSString *clsName = [NSStringFromClass([view class]) lowercaseString];
              if ([clsName containsString:@"khoindvn"] ||
                  [clsName containsString:@"splash"] ||
                  [clsName containsString:@"advert"]) {
                  return YES;
              }

              CGRect screenBounds = [UIScreen mainScreen].bounds;
              CGPoint screenCenter = CGPointMake(CGRectGetMidX(screenBounds), CGRectGetMidY(screenBounds));
              CGRect frame = view.frame;

              if ([view isKindOfClass:[UIImageView class]]) {
                  CGFloat w = frame.size.width;
                  CGFloat h = frame.size.height;
                  CGPoint center = view.center;
                  BOOL isSquareSplashSize = (w >= 140.0 && w <= 380.0 && h >= 140.0 && h <= 380.0 && fabs(w - h) <= 45.0);
                  BOOL isCentered = (fabs(center.x - screenCenter.x) <= 60.0 && fabs(center.y - screenCenter.y) <= 100.0);
                  if (isSquareSplashSize && isCentered) {
                      return YES;
                  }
                  if ([view.superview isKindOfClass:[UIWindow class]]) {
                      return YES;
                  }
              }

              if ([view isMemberOfClass:[UIView class]]) {
                  UIView *superview = view.superview;
                  if ([superview isKindOfClass:[UIWindow class]]) {
                      UIWindow *win = (UIWindow *)superview;
                      if (win.rootViewController && win.rootViewController.view != view) {
                          return YES;
                      }
                  }
                  BOOL isFullScreen = (fabs(frame.size.width - screenBounds.size.width) <= 20.0 &&
                                       fabs(frame.size.height - screenBounds.size.height) <= 40.0);
                  if (isFullScreen && view.subviews.count >= 1 && view.subviews.count <= 3) {
                      for (UIView *sub in view.subviews) {
                          if ([sub isKindOfClass:[UIImageView class]]) {
                              CGFloat sw = sub.frame.size.width;
                              CGFloat sh = sub.frame.size.height;
                              if (sw >= 140.0 && sw <= 380.0 && fabs(sw - sh) <= 45.0) {
                                  return YES;
                              }
                          }
                      }
                  }
              }
              return NO;
          }

          static void PurgeSplashViewIfNeeded(UIView *view) {
              if (!view) return;
              if (IsSplashPopupView(view)) {
                  UIView *parent = view.superview;
                  view.hidden = YES;
                  view.alpha = 0.0;
                  if ([view isKindOfClass:[UIImageView class]]) {
                      ((UIImageView *)view).image = nil;
                  }
                  if (parent && [parent isMemberOfClass:[UIView class]] && !IsSystemProtectedView(parent)) {
                      UIWindow *win = parent.window;
                      if (!win || win.rootViewController.view != parent) {
                          parent.hidden = YES;
                          parent.alpha = 0.0;
                          [parent removeFromSuperview];
                      }
                  }
                  [view removeFromSuperview];
              }
          }

          static void ScanAndPurgeWindowOverlays(void) {
              NSArray<UIWindow *> *windows = [[UIApplication sharedApplication] windows];
              for (UIWindow *window in windows) {
                  for (UIView *sub in [window.subviews copy]) {
                      PurgeSplashViewIfNeeded(sub);
                      for (UIView *nested in [sub.subviews copy]) {
                          PurgeSplashViewIfNeeded(nested);
                      }
                  }
                  UIView *rootView = window.rootViewController.view;
                  if (rootView) {
                      for (UIView *sub in [rootView.subviews copy]) {
                          PurgeSplashViewIfNeeded(sub);
                          for (UIView *nested in [sub.subviews copy]) {
                              PurgeSplashViewIfNeeded(nested);
                          }
                      }
                  }
              }
          }

          static void ShowCustomModToastIfEnabled(void) {
              if (!kShowCustomWelcomeBanner) return;
              UIWindow *keyWin = nil;
              for (UIWindow *w in [[UIApplication sharedApplication] windows]) {
                  if (w.isKeyWindow) { keyWin = w; break; }
              }
              if (!keyWin) keyWin = [[[UIApplication sharedApplication] windows] firstObject];
              if (!keyWin) return;

              CGFloat width = MIN([UIScreen mainScreen].bounds.size.width - 40.0, 320.0);
              UIView *banner = [[UIView alloc] initWithFrame:CGRectMake(([UIScreen mainScreen].bounds.size.width - width) / 2.0, 64.0, width, 52.0)];
              banner.tag = 994411;
              banner.backgroundColor = [UIColor colorWithRed:0.07 green:0.09 blue:0.15 alpha:0.95];
              banner.layer.cornerRadius = 14.0;
              banner.layer.borderWidth = 1.0;
              banner.layer.borderColor = [UIColor colorWithRed:0.15 green:0.80 blue:0.55 alpha:0.6].CGColor;

              UILabel *label = [[UILabel alloc] initWithFrame:banner.bounds];
              label.tag = 994411;
              label.text = [NSString stringWithFormat:@"Mod by %@  •  Telegram", kCustomBrandTag];
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont boldSystemFontOfSize:14.0];
              label.textAlignment = NSTextAlignmentCenter;
              [banner addSubview:label];

              [keyWin addSubview:banner];
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(3.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  [UIView animateWithDuration:0.3 animations:^{
                      banner.alpha = 0.0;
                  } completion:^(BOOL finished) {
                      [banner removeFromSuperview];
                  }];
              });
          }

          static id (*orig_NSURL_URLWithString)(id, SEL, NSString *);
          static BOOL (*orig_UIApp_openURL)(id, SEL, NSURL *);
          static void (*orig_UIApp_openURL_options_completion)(id, SEL, NSURL *, NSDictionary *, void (^)(BOOL));
          static id (*orig_SFSafari_initWithURL)(id, SEL, NSURL *);
          static id (*orig_SFSafari_initWithURL_config)(id, SEL, NSURL *, SFSafariViewControllerConfiguration *);
          static void (*orig_UILabel_setText)(id, SEL, NSString *);
          static void (*orig_UIView_didMoveToSuperview)(id, SEL);
          static void (*orig_UIView_addSubview)(id, SEL, UIView *);
          static void (*orig_UIViewController_present)(id, SEL, UIViewController *, BOOL, void (^)(void));

          static id swizzled_NSURL_URLWithString(id self, SEL _cmd, NSString *URLString) {
              NSMutableDictionary *threadDict = [[NSThread currentThread] threadDictionary];
              if ([threadDict[kRecursionGuardKey] boolValue]) {
                  return orig_NSURL_URLWithString(self, _cmd, URLString);
              }
              if (ShouldRedirectURLString(URLString)) {
                  threadDict[kRecursionGuardKey] = @YES;
                  id redirectedURL = orig_NSURL_URLWithString(self, _cmd, kTargetTelegramURL);
                  threadDict[kRecursionGuardKey] = @NO;
                  return redirectedURL;
              }
              return orig_NSURL_URLWithString(self, _cmd, URLString);
          }

          static BOOL swizzled_UIApp_openURL(id self, SEL _cmd, NSURL *url) {
              return orig_UIApp_openURL(self, _cmd, RedirectedURLIfNeeded(url));
          }

          static void swizzled_UIApp_openURL_options_completion(id self, SEL _cmd, NSURL *url, NSDictionary *options, void (^completion)(BOOL success)) {
              orig_UIApp_openURL_options_completion(self, _cmd, RedirectedURLIfNeeded(url), options, completion);
          }

          static id swizzled_SFSafari_initWithURL(id self, SEL _cmd, NSURL *URL) {
              return orig_SFSafari_initWithURL(self, _cmd, RedirectedURLIfNeeded(URL));
          }

          static id swizzled_SFSafari_initWithURL_config(id self, SEL _cmd, NSURL *URL, SFSafariViewControllerConfiguration *configuration) {
              return orig_SFSafari_initWithURL_config(self, _cmd, RedirectedURLIfNeeded(URL), configuration);
          }

          static void swizzled_UILabel_setText(id self, SEL _cmd, NSString *text) {
              orig_UILabel_setText(self, _cmd, SanitizeBrandingText(text));
          }

          static void swizzled_UIView_didMoveToSuperview(id self, SEL _cmd) {
              orig_UIView_didMoveToSuperview(self, _cmd);
              PurgeSplashViewIfNeeded((UIView *)self);
          }

          static void swizzled_UIView_addSubview(id self, SEL _cmd, UIView *view) {
              orig_UIView_addSubview(self, _cmd, view);
              PurgeSplashViewIfNeeded(view);
          }

          static void swizzled_UIViewController_present(id self, SEL _cmd, UIViewController *vcToPresent, BOOL flag, void (^completion)(void)) {
              if ([vcToPresent isKindOfClass:[UIAlertController class]]) {
                  UIAlertController *alert = (UIAlertController *)vcToPresent;
                  NSString *combined = [[NSString stringWithFormat:@"%@ %@", alert.title ?: @"", alert.message ?: @""] lowercaseString];
                  if ([combined containsString:@"khoindvn"] ||
                      [combined containsString:@"khoindns"] ||
                      [combined containsString:@"yyyue"] ||
                      [combined containsString:@"discord"]) {
                      if (completion) completion();
                      return;
                  }
              }
              orig_UIViewController_present(self, _cmd, vcToPresent, flag, completion);
          }

          static void SwizzleInstanceMethod(Class cls, SEL selector, IMP newImp, IMP *origImpOut) {
              if (!cls) return;
              Method method = class_getInstanceMethod(cls, selector);
              if (!method) return;
              if (origImpOut) *origImpOut = method_getImplementation(method);
              if (!class_addMethod(cls, selector, newImp, method_getTypeEncoding(method))) {
                  method_setImplementation(method, newImp);
              }
          }

          static void SwizzleClassMethod(Class cls, SEL selector, IMP newImp, IMP *origImpOut) {
              if (!cls) return;
              Method method = class_getClassMethod(cls, selector);
              if (!method) return;
              Class metaCls = object_getClass((id)cls);
              if (origImpOut) *origImpOut = method_getImplementation(method);
              if (!class_addMethod(metaCls, selector, newImp, method_getTypeEncoding(method))) {
                  method_setImplementation(method, newImp);
              }
          }

          __attribute__((constructor))
          static void InitializeRedirectorTweak(void) {
              @autoreleasepool {
                  gLaunchTimestamp = CFAbsoluteTimeGetCurrent();

                  SwizzleClassMethod([NSURL class], @selector(URLWithString:), (IMP)swizzled_NSURL_URLWithString, (IMP *)&orig_NSURL_URLWithString);
                  SwizzleInstanceMethod([UIApplication class], @selector(openURL:), (IMP)swizzled_UIApp_openURL, (IMP *)&orig_UIApp_openURL);
                  SwizzleInstanceMethod([UIApplication class], @selector(openURL:options:completionHandler:), (IMP)swizzled_UIApp_openURL_options_completion, (IMP *)&orig_UIApp_openURL_options_completion);

                  Class safariClass = [SFSafariViewController class];
                  if (safariClass) {
                      SwizzleInstanceMethod(safariClass, @selector(initWithURL:), (IMP)swizzled_SFSafari_initWithURL, (IMP *)&orig_SFSafari_initWithURL);
                      SwizzleInstanceMethod(safariClass, @selector(initWithURL:configuration:), (IMP)swizzled_SFSafari_initWithURL_config, (IMP *)&orig_SFSafari_initWithURL_config);
                  }

                  SwizzleInstanceMethod([UILabel class], @selector(setText:), (IMP)swizzled_UILabel_setText, (IMP *)&orig_UILabel_setText);
                  SwizzleInstanceMethod([UIView class], @selector(didMoveToSuperview), (IMP)swizzled_UIView_didMoveToSuperview, (IMP *)&orig_UIView_didMoveToSuperview);
                  SwizzleInstanceMethod([UIView class], @selector(addSubview:), (IMP)swizzled_UIView_addSubview, (IMP *)&orig_UIView_addSubview);
                  SwizzleInstanceMethod([UIViewController class], @selector(presentViewController:animated:completion:), (IMP)swizzled_UIViewController_present, (IMP *)&orig_UIViewController_present);

                  for (NSNumber *delay in @[@0.1, @0.3, @0.6, @1.0, @1.5, @2.5, @4.0]) {
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)([delay doubleValue] * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          ScanAndPurgeWindowOverlays();
                      });
                  }

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.2 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      ShowCustomModToastIfEnabled();
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework Foundation \
            -framework UIKit \
            -framework SafariServices \
            -install_name @executable_path/Frameworks/Redirector.dylib \
            Tweak.m \
            -o Redirector.dylib

      - name: Upload Redirector.dylib to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redirector-dylib
          path: Redirector.dylib
          if-no-files-found: error

      - name: Publish Direct Download in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "PRO Clean Mod Redirector.dylib (Сборка #${{ github.run_number }})"
          files: Redirector.dylib